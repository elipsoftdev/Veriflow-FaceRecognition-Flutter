// facesdk_plugin/android/build.gradle
plugins {
    id("com.android.library")          // versión fijada en settings.gradle
    id("org.jetbrains.kotlin.android") // versión fijada en settings.gradle
}

android {
    namespace "com.faceplugin.facesdk_plugin"
    compileSdk 35

    defaultConfig {
        minSdk 24
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        jniLibs.keepDebugSymbols += ["**/*.so"]
        resources.excludes += ["META-INF/*"]
    }

    buildTypes {
        debug  { minifyEnabled false }
        release{
            // minify lo decide la app host
        }
    }
}

dependencies {
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation "com.google.mediapipe:tasks-vision:0.10.14"
    implementation "org.tensorflow:tensorflow-lite:2.12.0"

    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}
