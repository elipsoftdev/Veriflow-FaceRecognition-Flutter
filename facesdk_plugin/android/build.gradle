plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.faceplugin.facesdk_plugin"
    compileSdk 35

    defaultConfig {
        minSdk 24
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        // Reglas del consumidor (por si la app activa minify)
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        // Kotlin 2.1.x + JDK 17
        jvmTarget = "17"
    }

    // AGP 8+: usar la DSL nueva de packaging
    packaging {
        jniLibs {
            // Equivale al viejo doNotStrip: conserva símbolos en *.so
            keepDebugSymbols += ["**/*.so"]
        }
        resources {
            excludes += ["META-INF/*"]
        }
    }

    // (Opcional) si necesitas el directorio de assets explícito
    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets"]
        }
    }

    // Nada de shrinkResources ni postprocessing en librerías
    buildTypes {
        debug {
            // Asegura que no intenten shrink aquí
            minifyEnabled false
        }
        release {
            // La app decide si minificar; aquí no forzamos shrink
            // minifyEnabled false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // ✅ CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:1.3.4" // PreviewView

    // 🧠 Visión
    implementation "com.google.mediapipe:tasks-vision:0.10.14"

    // TFLite (puedes subirlo luego si lo necesitas)
    implementation "org.tensorflow:tensorflow-lite:2.12.0"
    // implementation "org.tensorflow:tensorflow-lite-select-tf-ops:2.12.0"
}
