// facesdk_plugin/android/settings.gradle
import java.util.Properties

def loadFlutterSdkPath() {
    def props = new Properties()
    def localProperties = file("local.properties")
    if (!localProperties.exists()) {
        throw new GradleException("No se encontró local.properties en ${localProperties.absolutePath}")
    }
    localProperties.withInputStream { props.load(it) }
    def flutterSdk = props.getProperty("flutter.sdk")
    if (flutterSdk == null) {
        throw new GradleException("flutter.sdk not set in local.properties")
    }
    return flutterSdk
}

def flutterSdkPath = loadFlutterSdkPath()

pluginManagement {
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id("dev.flutter.flutter-plugin-loader") version "1.0.0"
        id("dev.flutter.flutter-gradle-plugin") version "1.0.0" apply false
        id("com.android.library") version "8.7.2" apply false
        id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "facesdk_plugin"
