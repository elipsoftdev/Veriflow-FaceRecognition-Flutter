// facesdk_plugin/android/settings.gradle
pluginManagement {
    def props = new Properties()
    def lp = file("local.properties")
    if (!lp.exists()) throw new RuntimeException("No se encontró local.properties en ${lp.absolutePath}")
    lp.withInputStream { props.load(it) }
    def flutterSdkPath = props.getProperty("flutter.sdk")
    if (flutterSdkPath == null) throw new RuntimeException("flutter.sdk not set in local.properties")

    // Necesario para que Flutter registre su infraestructura Gradle
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // ⬇️ Versión fija de plugins (evita “must include a version number”)
    plugins {
        id("com.android.library") version "8.5.2"
        id("org.jetbrains.kotlin.android") version "1.9.24"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "facesdk_plugin"
