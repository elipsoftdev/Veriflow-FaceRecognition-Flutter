// facesdk_plugin/example/android/app/build.gradle
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

android {
    namespace "com.faceplugin.facesdk_plugin_example"
    compileSdk 35

    defaultConfig {
        applicationId "com.faceplugin.facesdk_plugin_example"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        jniLibs.keepDebugSymbols += ["**/*.so"]
        resources.excludes += ["META-INF/*"]
    }

    buildTypes {
        debug  { minifyEnabled false }
        release{
            // Ajusta tu signing si lo necesitas
            minifyEnabled false
        }
    }
}

// El plugin de Flutter está disponible por el loader en settings.gradle
flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}
