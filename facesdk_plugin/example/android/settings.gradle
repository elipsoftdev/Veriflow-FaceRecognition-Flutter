// facesdk_plugin/example/android/settings.gradle

pluginManagement {
    def props = new Properties()
    def lp = file("local.properties")
    if (!lp.exists()) {
        throw new RuntimeException("No se encontró local.properties en ${lp.absolutePath}")
    }
    lp.withInputStream { props.load(it) }
    def flutterSdkPath = props.getProperty("flutter.sdk")
    if (flutterSdkPath == null) {
        throw new RuntimeException("flutter.sdk not set in local.properties")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // 🔧 Fija versiones para el ejemplo también
    plugins {
    id("dev.flutter.flutter-plugin-loader") version "1.0.0"
    id("com.android.application") version "8.5.2" apply false
    id("com.android.library") version "8.5.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}

// Carga el plugin de Flutter
plugins {
    id("dev.flutter.flutter-plugin-loader")
}

include(":app")
}